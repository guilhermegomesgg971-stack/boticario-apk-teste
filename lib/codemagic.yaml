workflows:
  build-android-apk:
    name: Gerar APK Android Direto
    max_build_timeout: 30
    environment:
      flutter: stable
    scripts:
      - name: Criar estrutura Android se nao existir
        script: flutter create . --platforms=android --org com.boticario.app
      - name: Instalar dependencias
        script: flutter pub get
      - name: Construir APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
