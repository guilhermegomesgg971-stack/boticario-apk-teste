workflows:
  build-android-apk:
    name: Gerar APK Android Direto
    max_build_timeout: 30
    environment:
      flutter: stable
    scripts:
      - name: Limpar projeto anterior
        script: flutter clean
      - name: Instalar dependencias
        script: flutter pub get
      - name: Gerar APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
