workflows:
  build-android-apk:
    name: Gerar APK Android
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Limpar build anterior
        script: |
          flutter clean
      - name: Instalar dependencias do projeto
        script: |
          flutter pub get
      - name: Construir APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
