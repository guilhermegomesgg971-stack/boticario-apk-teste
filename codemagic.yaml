workflows:
  build-android-apk:
    name: Gerar APK Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Limpar tudo e recriar projeto moderno
        script: |
          flutter clean
          rm -rf android ios
          flutter create . --platforms=android --org com.marketplace.pro
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Gerar APK final
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
